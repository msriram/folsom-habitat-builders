name: Homework email reminders

on:
  schedule:
    # The function computes Pacific-time Wednesday delivery windows.
    # Run every 15 minutes so DST changes do not require editing this file.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Process due homework reminders
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --request POST \
            --url "https://tcggcoqbsispkzgypdet.supabase.co/functions/v1/homework-reminders" \
            --header "x-reminder-secret: ${REMINDER_CRON_SECRET}"
